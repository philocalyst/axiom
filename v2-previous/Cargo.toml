[package]
name = "axiom-v2"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A small, reproducible ledger with package-defined economic laws"

[dependencies]
blake3 = "1.8"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.13"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
axiom-ledger = { path = ".." }

[[bin]]
name = "axiom-v2"
path = "src/main.rs"
