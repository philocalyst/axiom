[package]
name = "axiom-ledger"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A proof-producing, content-addressed economic ledger"

[[bin]]
name = "axiom"
path = "src/main.rs"

[dependencies]
