[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
axiom-core = { path = "crates/core" }
axiom-syntax = { path = "crates/syntax" }
axiom-model = { path = "crates/model" }
axiom-engine = { path = "crates/engine" }
axiom-report = { path = "crates/report" }
axiom-session = { path = "crates/session" }
axiom-systems = { path = "crates/systems" }
axiom-sync = { path = "crates/sync" }
memchr = "2.8"
fearless_simd = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
